<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">Long方格图标 RC1 主题与尺寸审计</title>
  <desc id="desc">展示浅色彩色、深色彩色、深色单色、浅色单色、高对比回退，以及八个像素校正尺寸。</desc>
  <rect width="1200" height="780" fill="#F4F6FB"/>
  <text x="64" y="70" fill="#171A2B" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="34" font-weight="700">Long方格 · Icon RC1</text>
  <text x="64" y="108" fill="#596174" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="18">A「结构化 L」/ 主题变体 / 逐尺寸整数像素校正</text>

  <g transform="translate(64 154)">
    <rect width="200" height="258" rx="24" fill="#FFFFFF"/>
    <image href="source/longfangge-color-light.svg" x="28" y="24" width="144" height="144"/>
    <text x="28" y="204" fill="#171A2B" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="17" font-weight="700">彩色 · 浅色环境</text>
    <text x="28" y="232" fill="#596174" font-family="Segoe UI, sans-serif" font-size="14">Primary candidate</text>
  </g>
  <g transform="translate(282 154)">
    <rect width="200" height="258" rx="24" fill="#FFFFFF"/>
    <image href="source/longfangge-color-dark.svg" x="28" y="24" width="144" height="144"/>
    <text x="28" y="204" fill="#171A2B" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="17" font-weight="700">彩色 · 深色环境</text>
    <text x="28" y="232" fill="#596174" font-family="Segoe UI, sans-serif" font-size="14">Dark surface</text>
  </g>
  <g transform="translate(500 154)">
    <rect width="200" height="258" rx="24" fill="#FFFFFF"/>
    <image href="source/longfangge-monochrome-dark.svg" x="28" y="24" width="144" height="144"/>
    <text x="28" y="204" fill="#171A2B" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="17" font-weight="700">单色 · 深色字形</text>
    <text x="28" y="232" fill="#596174" font-family="Segoe UI, sans-serif" font-size="14">Transparent canvas</text>
  </g>
  <g transform="translate(718 154)">
    <rect width="200" height="258" rx="24" fill="#171A2B"/>
    <image href="source/longfangge-monochrome-light.svg" x="28" y="24" width="144" height="144"/>
    <text x="28" y="204" fill="#FFFFFF" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="17" font-weight="700">单色 · 浅色字形</text>
    <text x="28" y="232" fill="#C7CBD6" font-family="Segoe UI, sans-serif" font-size="14">Transparent canvas</text>
  </g>
  <g transform="translate(936 154)">
    <rect width="200" height="258" rx="24" fill="#FFFFFF"/>
    <image href="source/longfangge-high-contrast.svg" x="28" y="24" width="144" height="144"/>
    <text x="28" y="204" fill="#171A2B" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="17" font-weight="700">静态高对比回退</text>
    <text x="28" y="232" fill="#596174" font-family="Segoe UI, sans-serif" font-size="14">Black / white only</text>
  </g>

  <text x="64" y="478" fill="#171A2B" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="24" font-weight="700">像素校正尺寸</text>
  <text x="64" y="510" fill="#596174" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15">下方按相同展示框排列；源 SVG 的 width、height 与 viewBox 均为目标原生尺寸。</text>

  <g transform="translate(64 548)">
    <image href="sizes/svg/longfangge-16.svg" x="0" y="40" width="16" height="16"/>
    <image href="sizes/svg/longfangge-20.svg" x="70" y="36" width="20" height="20"/>
    <image href="sizes/svg/longfangge-24.svg" x="144" y="32" width="24" height="24"/>
    <image href="sizes/svg/longfangge-32.svg" x="222" y="24" width="32" height="32"/>
    <image href="sizes/svg/longfangge-48.svg" x="310" y="8" width="48" height="48"/>
    <image href="sizes/svg/longfangge-64.svg" x="414" y="0" width="64" height="64"/>
    <image href="sizes/svg/longfangge-128.svg" x="534" y="0" width="128" height="128"/>
    <image href="sizes/svg/longfangge-256.svg" x="718" y="0" width="128" height="128"/>
    <g fill="#596174" font-family="Segoe UI, sans-serif" font-size="14">
      <text x="0" y="96">16</text><text x="70" y="96">20</text><text x="144" y="96">24</text><text x="222" y="96">32</text><text x="310" y="96">48</text><text x="414" y="96">64</text><text x="574" y="154">128</text><text x="758" y="154">256</text>
    </g>
  </g>
  <text x="64" y="744" fill="#596174" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15">RC1 不是最终商标：Windows 外壳实机矩阵、近似性检索、ICO/MSIX 生成和负责人最终签字仍待完成。</text>
</svg>
