name: CodeQL

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [csharp, c-cpp]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate GitHub Actions pins
        shell: powershell
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass
          -File ./eng/Test-LongGridWorkflowActionPins.ps1

      - name: Validate CodeQL workflow contract
        shell: powershell
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass
          -File ./eng/Test-LongGridCodeQlWorkflow.ps1

      - name: Setup .NET
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Packages.props

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: manual

      - name: Restore locked .NET dependencies
        if: matrix.language == 'csharp'
        run: dotnet restore LongGrid.sln --locked-mode

      - name: Build managed solution for CodeQL
        if: matrix.language == 'csharp'
        run: dotnet build LongGrid.sln --configuration Release --no-restore

      - name: Build native ExplorerCommand for CodeQL
        if: matrix.language == 'c-cpp'
        shell: powershell
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass
          -File ./eng/Build-LongGridExplorerCommand.ps1
          -Configuration Release
          -Architecture x64

      - name: Analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          category: /language:${{ matrix.language }}
