name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Packages.props

      - name: Restore
        run: dotnet restore LongGrid.sln --locked-mode

      - name: Format
        run: dotnet format LongGrid.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build LongGrid.sln --configuration Release --no-restore

      - name: Validate Long Grid startup chain
        shell: powershell
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass
          -File ./eng/Start-LongGrid.ps1
          -Configuration Release
          -NoRestore
          -ValidateOnly

      - name: Validate Issue 19 manual matrix session chain
        shell: powershell
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass
          -File ./eng/Start-Issue19ManualMatrixSession.ps1
          -ValidateOnly

      - name: Validate Issue 23 usability session chain
        shell: powershell
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass
          -File ./eng/Start-Issue23UsabilitySession.ps1
          -ValidateOnly

      - name: Validate UI automation contract
        shell: powershell
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass
          -File ./eng/Test-LongGridUi.ps1
          -ContractOnly

      - name: Test
        run: >-
          dotnet test LongGrid.sln
          --configuration Release
          --no-build
          --logger "trx;LogFileName=tests.trx"
          --collect "XPlat Code Coverage"
          --results-directory TestResults

      - name: Coverage gate
        shell: powershell
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass
          -File ./eng/Verify-Coverage.ps1
          -MinimumLineRate 0.90
          -MinimumBranchRate 0.75

      - name: Configuration persistence probe
        run: >-
          dotnet run
          --project probes/LongGrid.Spikes.ConfigurationPersistence
          --configuration Release
          --no-build
          --
          --iterations 100
          --kill-iterations 2
          --acl-kill-iterations 2
          --json

      - name: File operation safety probe
        run: >-
          dotnet run
          --project probes/LongGrid.Spikes.FileOperationSafety
          --configuration Release
          --no-build
          --
          --json

      - name: Thumbnail worker isolation probe
        run: >-
          dotnet run
          --project probes/LongGrid.Spikes.ShellItemImages
          --configuration Release
          --no-build
          --
          --worker-matrix
          --json

      - name: Dependency vulnerability gate
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ./eng/Verify-VulnerablePackages.ps1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-and-coverage-results
          path: |
            TestResults/**/*.trx
            TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn
