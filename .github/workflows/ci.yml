name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Packages.props

      - name: Restore
        run: dotnet restore LongGrid.sln --locked-mode

      - name: Format
        run: dotnet format LongGrid.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build LongGrid.sln --configuration Release --no-restore

      - name: Test
        run: >-
          dotnet test LongGrid.sln
          --configuration Release
          --no-build
          --logger "trx;LogFileName=tests.trx"
          --collect "XPlat Code Coverage"
          --results-directory TestResults

      - name: Configuration persistence probe
        run: >-
          dotnet run
          --project probes/LongGrid.Spikes.ConfigurationPersistence
          --configuration Release
          --no-build
          --
          --iterations 100
          --kill-iterations 2
          --json

      - name: Dependency vulnerability gate
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ./eng/Verify-VulnerablePackages.ps1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-and-coverage-results
          path: |
            TestResults/**/*.trx
            TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn
