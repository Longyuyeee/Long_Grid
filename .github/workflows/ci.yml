name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate GitHub Actions pins
        shell: powershell
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass
          -File ./eng/Test-LongGridWorkflowActionPins.ps1

      - name: Validate Dependabot GitHub Actions update policy
        shell: powershell
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass
          -File ./eng/Test-LongGridDependabotConfiguration.ps1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Packages.props
            .config/dotnet-tools.json

      - name: Restore pinned repository tools
        run: dotnet tool restore

      - name: Validate CodeQL workflow contract
        shell: powershell
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass
          -File ./eng/Test-LongGridCodeQlWorkflow.ps1

      - name: Restore
        run: dotnet restore LongGrid.sln --locked-mode

      - name: Format
        shell: powershell
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass
          -File ./eng/Test-LongGridFormat.ps1

      - name: Build
        run: dotnet build LongGrid.sln --configuration Release --no-restore

      - name: Validate Long Grid startup chain
        shell: powershell
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass
          -File ./eng/Start-LongGrid.ps1
          -Configuration Release
          -NoRestore
          -ValidateOnly

      - name: Validate Issue 20 display matrix session chain
        shell: powershell
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass
          -File ./eng/Start-Issue20DisplayMatrixSession.ps1
          -ValidateOnly

      - name: Validate DesktopHost product session matrix chain
        shell: powershell
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass
          -File ./eng/Start-DesktopHostProductSessionMatrix.ps1
          -ValidateOnly

      - name: Validate intent preparation manual session chain
        shell: powershell
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass
          -File ./eng/Start-DesktopInteractionIntentSession.ps1
          -ValidateOnly

      - name: Validate isolated input forwarding session chain
        shell: powershell
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass
          -File ./eng/Start-DesktopInteractionInputForwardingSession.ps1
          -ValidateOnly

      - name: Validate product activation session chain
        shell: powershell
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass
          -File ./eng/Start-DesktopInteractionActivationSession.ps1
          -ValidateOnly

      - name: Validate system-surface manual session chain
        shell: powershell
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass
          -File ./eng/Start-DesktopInteractionSystemSurfaceSession.ps1
          -ValidateOnly

      - name: Validate Issue 19 manual matrix session chain
        shell: powershell
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass
          -File ./eng/Start-Issue19ManualMatrixSession.ps1
          -ValidateOnly

      - name: Validate batch selection accessibility session chain
        shell: powershell
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass
          -File ./eng/Start-LongGridBatchAccessibilitySession.ps1
          -ValidateOnly

      - name: Validate Issue 23 usability session chain
        shell: powershell
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass
          -File ./eng/Start-Issue23UsabilitySession.ps1
          -ValidateOnly

      - name: Validate Issue 24 persistence boundary session chain
        shell: powershell
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass
          -File ./eng/Start-Issue24PersistenceBoundarySession.ps1
          -ValidateOnly

      - name: Validate DesktopHost Unicode and interactive slice contract
        run: >-
          dotnet run
          --project probes/LongGrid.Spikes.DesktopHostWindowModels
          --configuration Release
          --no-build
          --
          --interactive-slice-smoke
          --json

      - name: Validate native interaction surface mode adapter
        run: >-
          dotnet run
          --project probes/LongGrid.Spikes.DesktopHostWindowModels
          --configuration Release
          --no-build
          --
          --native-interaction-surface
          --json

      - name: Validate native isolated input forwarding source
        run: >-
          dotnet run
          --project probes/LongGrid.Spikes.DesktopHostWindowModels
          --configuration Release
          --no-build
          --
          --native-input-forwarding
          --json

      - name: Validate UI automation contract
        shell: powershell
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass
          -File ./eng/Test-LongGridUi.ps1
          -ContractOnly

      - name: Validate clean-session UIA chain
        shell: powershell
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass
          -File ./eng/Test-LongGridCleanSession.ps1
          -ValidateOnly

      - name: Validate single-instance activation contract
        shell: powershell
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass
          -File ./eng/Test-LongGridSingleInstance.ps1
          -ContractOnly

      - name: Validate VSTest hang diagnostic contract
        shell: powershell
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass
          -File ./eng/Test-LongGridCiHangDiagnostics.ps1

      - name: Validate RC runtime restore contract
        shell: powershell
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass
          -File ./eng/Test-LongGridCiReleaseRestore.ps1

      - name: Shutdown build servers before real-process tests
        run: dotnet build-server shutdown

      - name: Test
        run: >-
          dotnet test LongGrid.sln
          --configuration Release
          --no-build
          --logger "trx;LogFileName=tests.trx"
          --collect "XPlat Code Coverage"
          --blame-hang
          --blame-hang-timeout 2m
          --blame-hang-dump-type none
          --results-directory TestResults

      - name: Coverage gate
        shell: powershell
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass
          -File ./eng/Verify-Coverage.ps1
          -MinimumLineRate 0.90
          -MinimumBranchRate 0.75

      - name: Configuration persistence probe
        run: >-
          dotnet run
          --project probes/LongGrid.Spikes.ConfigurationPersistence
          --configuration Release
          --no-build
          --
          --iterations 100
          --kill-iterations 2
          --acl-kill-iterations 2
          --json

      - name: Product 500-item scale preflight
        run: >-
          dotnet run
          --project tools/LongGrid.Tools.ProductScalePreflight
          --configuration Release
          --no-build

      - name: Product recovery fault preflight
        run: >-
          dotnet run
          --project tools/LongGrid.Tools.ProductRecoveryPreflight
          --configuration Release
          --no-build

      - name: DesktopHost lifecycle recovery preflight
        run: >-
          dotnet run
          --project tools/LongGrid.Tools.DesktopHostRecoveryPreflight
          --configuration Release
          --no-build

      - name: Accelerated resource stability preflight
        run: >-
          dotnet run
          --project tools/LongGrid.Tools.ResourceStabilityPreflight
          --configuration Release
          --no-build

      - name: Validate anonymous resource telemetry session contract
        shell: powershell
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass
          -File ./eng/Start-LongGridResourceStabilitySession.ps1
          -ValidateOnly

      - name: Validate resource stability environment preflight contract
        shell: powershell
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass
          -File ./eng/Test-LongGridResourceStabilityEnvironment.ps1
          -ValidateOnly

      - name: Validate resource stability evidence review contract
        shell: powershell
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass
          -File ./eng/Review-LongGridResourceStabilityEvidence.ps1
          -ValidateOnly

      - name: File operation safety probe
        run: >-
          dotnet run
          --project probes/LongGrid.Spikes.FileOperationSafety
          --configuration Release
          --no-build
          --
          --json

      - name: Formal product thumbnail worker isolation probe
        run: >-
          dotnet run
          --project probes/LongGrid.Spikes.ShellItemImages
          --configuration Release
          --no-build
          --
          --worker-matrix
          --json

      - name: Dependency vulnerability gate
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ./eng/Verify-VulnerablePackages.ps1

      - name: Dependency license metadata gate
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ./eng/Test-LongGridDependencyLicenseGate.ps1

      - name: Build and audit internal unsigned RC delivery set
        shell: powershell
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass
          -File ./eng/Build-LongGridReleaseCandidate.ps1
          -PackageVersion 0.1.0.0
          -PortableVersion 0.1.0-ci
          -SkipQualityGates
          -NoToolRestore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-and-coverage-results
          path: |
            TestResults/**/*.trx
            TestResults/**/coverage.cobertura.xml
            TestResults/**/Sequence*.xml
          if-no-files-found: warn
